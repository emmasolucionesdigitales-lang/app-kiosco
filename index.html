<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño 1 — POS Ajustado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px;}
.wrapper{width:100%;max-width:480px;}
.label{font-size:14px;font-weight:600;margin-bottom:4px;color:#111;}
.sublabel{font-size:12px;color:#666;margin-bottom:12px;}
.pos{display:flex;border:1px solid #e0e0e0;border-radius:14px;overflow:hidden;background:#fafafa;box-shadow:0 2px 12px rgba(0,0,0,.07);}

/* IZQUIERDA — productos angostos */
.left{width:115px;flex-shrink:0;padding:10px;overflow-y:auto;max-height:540px;border-right:1px solid #e8e8e8;background:#f9f9f9;}
.left-title{font-size:9px;font-weight:700;color:#999;letter-spacing:.06em;margin-bottom:8px;}
.prod-list{display:flex;flex-direction:column;gap:5px;}
.prod{background:#fff;border:1px solid #e8e8e8;border-radius:8px;padding:8px 5px;cursor:pointer;text-align:center;position:relative;transition:border-color .15s,background .15s;}
.prod:hover{background:#f0f7ff;border-color:#90c3f0;}
.prod.en{border:1.5px solid #1a6fcf;background:#f0f7ff;}
.prod .ic{font-size:22px;display:block;margin-bottom:2px;}
.prod .pn{font-size:9px;font-weight:600;color:#222;line-height:1.2;margin-bottom:2px;}
.prod .pp{font-size:9px;color:#1a6fcf;font-weight:600;}
.badge{position:absolute;top:-7px;right:-7px;background:#1a6fcf;color:#fff;width:17px;height:17px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;}

/* DERECHA — carrito ancho */
.right{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;background:#fff;}
.cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.cart-title{font-size:9px;font-weight:700;color:#999;letter-spacing:.06em;}
.btn-limpiar{font-size:11px;color:#999;background:none;border:none;cursor:pointer;}
.cart-list{flex:1;overflow-y:auto;min-height:240px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:#bbb;}
.empty .eic{font-size:34px;margin-bottom:8px;}
.empty .etxt{font-size:12px;}
.ci{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0f0f0;}
.ci .cic{font-size:20px;flex-shrink:0;}
.ci .cinfo{flex:1;min-width:0;}
.ci .cname{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#111;}
.ci .ccat{font-size:11px;color:#aaa;}
.ci .cmath{font-size:11px;color:#999;margin-top:1px;}
.ci .cmath strong{color:#111;}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;}
.cb{width:26px;height:26px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-family:inherit;}
.cb.add{background:#1a6fcf;color:#fff;}
.cb.sub{background:#f0f0f0;color:#555;border:1px solid #e0e0e0;}
.cqty{font-size:12px;font-weight:700;color:#1a6fcf;}

/* Pie */
.footer{border-top:1px solid #eee;padding-top:12px;margin-top:8px;}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.total-label{font-size:13px;color:#666;}
.total-val{font-size:24px;font-weight:700;color:#1a6fcf;}
.metodos{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;}
.met{padding:7px 4px;border-radius:7px;border:1px solid #e0e0e0;background:#f8f8f8;font-size:11px;cursor:pointer;font-family:inherit;color:#333;}
.met:hover{background:#e8f0fc;border-color:#90c3f0;}
.met.sel{background:#e0edff;border-color:#1a6fcf;font-weight:600;color:#1a6fcf;}
.btn-cobrar{width:100%;padding:12px;border-radius:9px;border:none;background:#1a6fcf;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;}
.btn-cobrar:hover{background:#155db5;}
.btn-cobrar:disabled{background:#b8d4f5;cursor:default;}
</style>
</head>
<body>
<div class="wrapper">
  <div class="label">Diseño 1 — POS Clásico ajustado</div>
  <div class="sublabel">Productos angostos a la izquierda · Carrito detallado a la derecha</div>
  <div class="pos">
    <div class="left">
      <div class="left-title">PRODUCTOS</div>
      <div class="prod-list" id="prods"></div>
    </div>
    <div class="right">
      <div class="cart-header">
        <div class="cart-title" id="cart-title">CARRITO (0)</div>
        <button class="btn-limpiar" onclick="clr()">Limpiar</button>
      </div>
      <div class="cart-list" id="cart-list"></div>
      <div class="footer">
        <div class="total-row">
          <span class="total-label" id="prod-count">0 productos</span>
          <span class="total-val" id="total-val">$0</span>
        </div>
        <div class="metodos" id="metodos"></div>
        <button class="btn-cobrar" id="btn-cobrar" disabled>✓ Confirmar venta</button>
      </div>
    </div>
  </div>
</div>

<script>
const PRODS=[
  {id:'p1',ic:'🍫',n:'Alfajor Milka',cat:'Chocolates',pr:1200},
  {id:'p2',ic:'🥤',n:'Coca Cola 500ml',cat:'Bebidas',pr:1500},
  {id:'p3',ic:'⚡',n:'Red Bull 250ml',cat:'Energizantes',pr:2800},
  {id:'p4',ic:'🍟',n:'Papas Lays 100g',cat:'Snacks',pr:1800},
  {id:'p5',ic:'💧',n:'Agua 500ml',cat:'Agua',pr:800},
  {id:'p6',ic:'🫧',n:'Chiclets Adams',cat:'Chicles',pr:400},
  {id:'p7',ic:'🚬',n:'Marlboro x20',cat:'Cigarrillos',pr:4500},
  {id:'p8',ic:'🍺',n:'Quilmes 473ml',cat:'Cervezas',pr:2200},
];
const METS=['💵 Efectivo','💳 Débito','💳 Crédito','📲 QR'];
const cart={};
let metSel=0;
const ff=n=>'$'+n.toLocaleString('es-AR');
const total=()=>Object.entries(cart).reduce((s,[id,q])=>{const p=PRODS.find(x=>x.id===id);return s+(p?p.pr*q:0);},0);
const items=()=>Object.entries(cart).filter(([,q])=>q>0).map(([id,q])=>({...PRODS.find(x=>x.id===id),q}));
const cnt=()=>Object.values(cart).reduce((s,q)=>s+q,0);
function add(id){cart[id]=(cart[id]||0)+1;render();}
function rm(id){if(!cart[id])return;cart[id]--;if(!cart[id])delete cart[id];render();}
function clr(){Object.keys(cart).forEach(k=>delete cart[k]);render();}
function selMet(i){metSel=i;renderMets();}

function renderMets(){
  document.getElementById('metodos').innerHTML=METS.map((m,i)=>`<button class="met${metSel===i?' sel':''}" onclick="selMet(${i})">${m}</button>`).join('');
}

function render(){
  const t=total();const n=cnt();const ii=items();
  // Productos
  document.getElementById('prods').innerHTML=PRODS.map(p=>{const q=cart[p.id]||0;return`<div class="prod${q?' en':''}" onclick="add('${p.id}')">
    <span class="ic">${p.ic}</span>
    <div class="pn">${p.n}</div>
    <div class="pp">${ff(p.pr)}</div>
    ${q?`<div class="badge">${q}</div>`:''}
  </div>`;}).join('');
  // Carrito
  document.getElementById('cart-title').textContent=`CARRITO (${n})`;
  document.getElementById('cart-list').innerHTML=ii.length
    ?ii.map(it=>`<div class="ci">
      <span class="cic">${it.ic}</span>
      <div class="cinfo">
        <div class="cname">${it.n}</div>
        <div class="ccat">${it.cat}</div>
        <div class="cmath">${ff(it.pr)} × ${it.q} = <strong>${ff(it.pr*it.q)}</strong></div>
      </div>
      <div class="ctrl">
        <button class="cb add" onclick="add('${it.id}')">+</button>
        <span class="cqty">${it.q}</span>
        <button class="cb sub" onclick="rm('${it.id}')">−</button>
      </div>
    </div>`).join('')
    :`<div class="empty"><div class="eic">🛒</div><div class="etxt">Tocá un producto para agregar</div></div>`;
  document.getElementById('prod-count').textContent=`${n} producto${n!==1?'s':''}`;
  document.getElementById('total-val').textContent=ff(t);
  document.getElementById('btn-cobrar').disabled=n===0;
  renderMets();
}
render();
</script>
</body>
</html>
