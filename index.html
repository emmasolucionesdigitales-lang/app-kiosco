<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#fafaf9;--txt:#1c1917;--txt2:#78716c;--txt3:#a8a29e;--border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.25);--radius:8px;--radius-lg:12px;--green:#3B6D11;--green-bg:#EAF3DE;--orange:#854F0B;--orange-bg:#FAEEDA;--red:#A32D2D;--red-bg:#FCEBEB;--blue:#185FA5;--blue-bg:#E6F1FB;}
.dark{--bg:#1c1917;--bg2:#292524;--bg3:#0c0a09;--txt:#fafaf9;--txt2:#a8a29e;--txt3:#78716c;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);--green:#6aad2e;--green-bg:#1a2e0a;--orange:#d97706;--orange-bg:#2a1a00;--red:#e05555;--red-bg:#2a0a0a;--blue:#4b9fe0;--blue-bg:#0a1a2a;}
html,body{height:100%;background:var(--bg3);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--txt);}
body.dark{background:var(--bg3);}
#root{max-width:700px;margin:0 auto;min-height:100vh;background:var(--bg3);}
.header{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;}
.header-left{display:flex;flex-direction:column;gap:1px;}
.negocio-nombre{font-size:16px;font-weight:700;color:var(--txt);line-height:1.2;}
.header-fecha{font-size:11px;color:var(--txt2);}
.header-right{display:flex;align-items:center;gap:8px;}
.header-hora{font-size:15px;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums;}
.btn-config,.btn-dark{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 9px;font-size:16px;cursor:pointer;}
.app-body{padding:.85rem 1rem 76px;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:700px;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;padding:10px 4px 8px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-icon{font-size:22px;line-height:1;}
.nav-label{font-size:10px;color:var(--txt2);}
.nav-btn.activo .nav-label{color:var(--txt);font-weight:700;}
h2{font-size:17px;font-weight:700;color:var(--txt);margin-bottom:1rem;}
.search{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;background:var(--bg);color:var(--txt);}
.search:focus{outline:none;border-color:var(--border2);}
.btn-pri{background:var(--txt);color:var(--bg);border:none;border-radius:var(--radius);padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-pri:disabled{opacity:.3;cursor:not-allowed;}
.btn-sec{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px;font-size:14px;cursor:pointer;color:var(--txt2);}
.field{margin-bottom:.85rem;}
.field label{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px;font-weight:600;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;background:var(--bg);color:var(--txt);}
.field input:focus,.field select:focus{outline:none;border-color:var(--border2);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2);margin:.9rem 0 .5rem;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:1rem;overflow-y:auto;}
.modal{background:var(--bg);border-radius:var(--radius-lg);padding:1.25rem;width:100%;max-width:430px;margin:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-size:17px;font-weight:700;margin-bottom:1rem;color:var(--txt);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--txt2);font-size:14px;line-height:1.7;}
.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:9px 22px;border-radius:99px;font-size:14px;z-index:200;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.card-photo{width:100%;height:120px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;}
.card-photo img{width:100%;height:100%;object-fit:cover;}
.card-body{padding:9px 10px;}
.card-name{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3;}
.card-cat{font-size:11px;color:var(--txt2);margin-top:1px;}
.bc-row{display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:5px;padding:3px 6px;margin:4px 0;}
.bc-num{font-size:10px;font-family:monospace;color:var(--txt2);}
.prices{display:flex;gap:5px;align-items:baseline;flex-wrap:wrap;margin:3px 0;}
.p-venta{font-size:15px;font-weight:700;color:var(--txt);}
.p-costo{font-size:11px;color:var(--txt2);}
.mpill{font-size:11px;padding:1px 7px;border-radius:99px;font-weight:700;}
.m-alto{background:var(--green-bg);color:var(--green);}
.m-medio{background:var(--orange-bg);color:var(--orange);}
.m-bajo{background:var(--red-bg);color:var(--red);}
.m-sin{background:var(--bg2);color:var(--txt2);}
.stock-split{display:flex;gap:6px;margin-top:6px;}
.split-box{flex:1;border-radius:var(--radius);padding:6px 8px;text-align:center;}
.split-box.exh{background:#EAF3DE;}
.split-box.dep{background:#E6F1FB;}
.split-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.split-label.exh{color:var(--green);}
.split-label.dep{color:var(--blue);}
.split-val{font-size:18px;font-weight:700;}
.split-val.exh{color:var(--green);}
.split-val.dep{color:var(--blue);}
.split-ctrl{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:3px;}
.bsp{background:var(--bg);border:1px solid var(--border);border-radius:4px;width:22px;height:22px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.btn-pasar{width:100%;margin-top:6px;padding:7px;border:none;border-radius:var(--radius);font-size:12px;font-weight:700;cursor:pointer;background:var(--blue-bg);color:var(--blue);}
.alerta-dep{font-size:11px;color:var(--orange);font-weight:700;text-align:center;margin-top:4px;}
.card-actions{display:flex;gap:4px;margin-top:6px;}
.btn-ic{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:13px;cursor:pointer;flex:1;text-align:center;}
.foto-area{border:2px dashed var(--border);border-radius:var(--radius);height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg2);position:relative;overflow:hidden;gap:4px;}
.foto-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.foto-area p{font-size:12px;color:var(--txt2);text-align:center;padding:0 8px;}
.foto-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.bc-field{display:flex;gap:6px;}
.bc-field input{flex:1;}
.btn-scan{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-size:14px;cursor:pointer;}
.scan-wrap{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:200px;background:#000;position:relative;margin-bottom:8px;}
.scan-line{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,60,60,.85);z-index:2;}
.scan-hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:#fff;z-index:2;}
.mprev{font-size:12px;color:var(--txt2);margin-top:3px;}
.mprev span{font-weight:700;color:var(--green);}
.ventas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:480px){.ventas-grid{grid-template-columns:1fr;}}
.panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px;}
.ptitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:8px;}
.prod-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;}
.prod-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--bg);}
.prod-item:active{background:var(--bg2);}
.prod-item.agotado{opacity:.35;cursor:not-allowed;}
.pthumb{width:36px;height:36px;border-radius:6px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0;}
.pthumb img{width:100%;height:100%;object-fit:cover;}
.pdata{flex:1;min-width:0;}
.pname{font-size:13px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pstock{font-size:11px;color:var(--txt2);}
.pprice{font-size:13px;font-weight:700;color:var(--txt);}
.cart-list{min-height:60px;max-height:220px;overflow-y:auto;margin-bottom:8px;display:flex;flex-direction:column;gap:5px;}
.ci{display:flex;align-items:center;gap:6px;padding:7px 8px;background:var(--bg2);border-radius:var(--radius);}
.ci-name{flex:1;font-size:12px;font-weight:600;color:var(--txt);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qty-ctrl{display:flex;align-items:center;gap:3px;flex-shrink:0;}
.bq{background:var(--bg);border:1px solid var(--border);border-radius:5px;width:26px;height:26px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qn{font-size:13px;font-weight:700;min-width:20px;text-align:center;}
.ci-sub{font-size:12px;font-weight:700;color:var(--txt);flex-shrink:0;}
.btn-del{background:none;border:none;cursor:pointer;color:var(--txt2);font-size:14px;padding:2px 4px;}
.divider{height:1px;background:var(--border);margin:8px 0;}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.total-val{font-size:26px;font-weight:700;color:var(--txt);}
.metodos{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px;}
.btn-m{padding:7px 4px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--txt2);}
.btn-m.activo{background:var(--txt);color:var(--bg);border-color:var(--txt);}
.ef-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.ef-label{font-size:12px;color:var(--txt2);white-space:nowrap;font-weight:600;}
.ef-input{flex:1;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius);font-size:15px;font-weight:700;background:var(--bg);color:var(--txt);}
.vuelto{font-size:14px;font-weight:700;padding:6px 10px;border-radius:var(--radius);margin-bottom:7px;}
.v-ok{background:var(--green-bg);color:var(--green);}
.v-ko{background:var(--red-bg);color:var(--red);}
.btn-full{width:100%;padding:13px;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;border:none;background:var(--txt);color:var(--bg);}
.btn-full:disabled{opacity:.3;cursor:not-allowed;}
.btn-limpiar{width:100%;background:none;border:1px solid var(--border);border-radius:var(--radius);padding:7px;font-size:13px;cursor:pointer;color:var(--txt2);margin-top:6px;}
.rh{background:var(--bg2);border-radius:var(--radius-lg);padding:10px 13px;margin-top:10px;}
.rh-title{font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.rh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.rh-val{font-size:20px;font-weight:700;color:var(--txt);}
.rh-label{font-size:10px;color:var(--txt2);}
.kstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.ks{background:var(--bg2);border-radius:var(--radius);padding:.65rem .9rem;}
.ks-label{font-size:11px;color:var(--txt2);margin-bottom:2px;}
.ks-val{font-size:20px;font-weight:700;color:var(--txt);}
.ks-val.rojo{color:var(--red);}
.ccard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:8px;overflow:hidden;}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;}
.chead:active{background:var(--bg2);}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--blue);flex-shrink:0;}
.cinfo{flex:1;min-width:0;}
.cnombre{font-size:14px;font-weight:700;color:var(--txt);}
.ctel{font-size:12px;color:var(--txt2);}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.cdeuda{font-size:16px;font-weight:700;}
.dr{color:var(--red);}
.dg{color:var(--green);}
.dlabel{font-size:11px;color:var(--txt2);}
.cbody{border-top:1px solid var(--border);padding:10px 13px;}
.mov-list{display:flex;flex-direction:column;gap:4px;max-height:160px;overflow-y:auto;margin-bottom:10px;}
.mov{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 8px;border-radius:6px;}
.mov.fiado{background:#FFF5F5;}
.mov.pago{background:#F0FAF4;}
.dark .mov.fiado{background:#2a0a0a;}
.dark .mov.pago{background:#0a2a0a;}
.dark .stock-table tr.rojo{background:#2a0a0a;}
.dark .stock-table tr.amarillo{background:#2a1500;}
.dark .stock-table tr.verde{background:#0a1a0a;}
.mov-fecha{color:var(--txt2);min-width:58px;flex-shrink:0;}
.mov-desc{flex:1;color:var(--txt);}
.mov-m{font-weight:700;flex-shrink:0;}
.mneg{color:var(--red);}
.mpos{color:var(--green);}
.acciones{display:flex;gap:6px;}
.bf{flex:1;padding:8px;border:none;border-radius:var(--radius);font-size:13px;font-weight:700;cursor:pointer;}
.bf.fiar{background:var(--red-bg);color:var(--red);}
.bf.pagar{background:var(--green-bg);color:var(--green);}
.bf.del{flex:0;padding:8px 12px;background:var(--bg2);color:var(--txt2);}
.rtabs{display:flex;gap:3px;background:var(--bg2);border-radius:var(--radius);padding:3px;margin-bottom:1rem;}
.rtab{flex:1;padding:7px 4px;border:none;background:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt2);}
.rtab.activo{background:var(--bg);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.kpi{background:var(--bg2);border-radius:var(--radius);padding:.75rem 1rem;}
.kpi-label{font-size:11px;color:var(--txt2);margin-bottom:2px;font-weight:600;}
.kpi-val{font-size:22px;font-weight:700;color:var(--txt);}
.kpi-val.verde{color:var(--green);}
.kpi-val.rojo{color:var(--red);}
.kpi-sub{font-size:11px;color:var(--txt2);}
.rsec{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:10px;}
.rsec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:10px;}
.barra-wrap{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:3px;}
.barra{height:100%;border-radius:99px;background:var(--green);}
.pfila{display:grid;grid-template-columns:1fr 58px 58px 58px 58px;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
.pfila:last-child{border-bottom:none;}
.pfila.hdr{font-size:11px;color:var(--txt2);padding-bottom:6px;font-weight:700;}
.pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);font-weight:600;}
.nr{text-align:right;color:var(--txt);}
.nr.v{color:var(--green);font-weight:700;}
.global-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;}
.global-row label{font-size:13px;color:var(--txt2);white-space:nowrap;font-weight:600;}
.global-row input[type=range]{flex:1;accent-color:var(--txt);}
.global-row span{font-size:18px;font-weight:700;color:var(--txt);min-width:40px;text-align:right;}
.tm{width:100%;border-collapse:collapse;}
.tm th{font-size:11px;color:var(--txt2);text-align:right;padding:0 5px 6px;font-weight:700;}
.tm th:first-child{text-align:left;}
.tm td{font-size:12px;padding:7px 5px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tm tr:last-child td{border-bottom:none;}
.tm td:not(:first-child){text-align:right;}
.pct-input{width:50px;padding:4px 5px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:700;text-align:center;background:var(--bg);color:var(--txt);}
.pnuevo{font-weight:700;color:var(--txt);}
.dif{font-size:10px;font-weight:700;}
.dif.pos{color:var(--green);}
.dif.neg{color:var(--red);}
.nota-sm{font-size:11px;color:var(--txt2);margin-top:8px;font-style:italic;}
.caja-header{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem;}
.caja-kpi{border-radius:var(--radius-lg);padding:12px 14px;}
.caja-kpi.ventas{background:#EAF3DE;}
.caja-kpi.gastos{background:var(--red-bg);}
.caja-kpi.bruta{background:var(--blue-bg);}
.caja-kpi.neta{background:var(--txt);color:var(--bg);}
.ck-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;opacity:.7;margin-bottom:4px;}
.ck-val{font-size:26px;font-weight:700;line-height:1.1;}
.ck-sub{font-size:11px;margin-top:3px;opacity:.65;}
.gastos-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.gasto-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg2);border-radius:var(--radius);}
.gasto-desc{flex:1;font-size:13px;font-weight:500;color:var(--txt);}
.gasto-monto{font-size:14px;font-weight:700;color:var(--red);}
.gasto-del{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:15px;padding:2px 4px;}
.btn-gasto{width:100%;padding:9px;border:2px dashed var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;background:none;color:var(--txt2);margin-bottom:12px;}
.btn-cerrar{width:100%;padding:13px;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;border:none;background:#1a5c2e;color:#fff;margin-top:4px;}
.btn-cerrar:disabled{opacity:.35;cursor:not-allowed;}
.hist-list{display:flex;flex-direction:column;gap:8px;}
.hist-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.hist-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;cursor:pointer;}
.hist-fecha{font-size:14px;font-weight:700;color:var(--txt);}
.hist-neta{font-size:16px;font-weight:700;}
.hist-neta.pos{color:var(--green);}
.hist-neta.neg{color:var(--red);}
.hist-body{border-top:1px solid var(--border);padding:10px 13px;}
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.hg-item{background:var(--bg2);border-radius:var(--radius);padding:7px 10px;}
.hg-label{font-size:10px;color:var(--txt2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.hg-val{font-size:16px;font-weight:700;color:var(--txt);margin-top:2px;}
.no-hist{text-align:center;padding:2rem 1rem;color:var(--txt2);font-size:13px;line-height:1.7;}
.caja-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px;}
.caja-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:10px;}
.caja-tabs{display:flex;gap:3px;background:var(--bg2);border-radius:var(--radius);padding:3px;margin-bottom:1rem;}
.caja-tab{flex:1;padding:7px 4px;border:none;background:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--txt2);}
.caja-tab.activo{background:var(--bg);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.badge-cerrada{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--green-bg);color:var(--green);}
.badge-abierta{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--orange-bg);color:var(--orange);}
.stock-table{width:100%;border-collapse:collapse;}
.stock-table th{font-size:11px;color:var(--txt2);text-align:left;padding:0 8px 8px;font-weight:700;border-bottom:2px solid var(--border);}
.stock-table th:not(:first-child){text-align:right;}
.stock-table td{font-size:13px;padding:8px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.stock-table tr:last-child td{border-bottom:none;}
.stock-table td:not(:first-child){text-align:right;}
.stock-table tr.rojo{background:#FFF5F5;}
.stock-table tr.amarillo{background:#FFFBF0;}
.stock-table tr.verde{background:#F4FAF0;}
.stock-ind{display:inline-flex;align-items:center;gap:5px;}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.dot-r{background:var(--red);}
.dot-a{background:#D97706;}
.dot-v{background:var(--green);}
.stock-pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;}
.sp-r{background:var(--red-bg);color:var(--red);}
.sp-a{background:#FEF3C7;color:#92400E;}
.sp-v{background:var(--green-bg);color:var(--green);}
.stock-filter{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.btn-filter{padding:5px 12px;border:1px solid var(--border);border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--txt2);}
.btn-filter.activo{background:var(--txt);color:var(--bg);border-color:var(--txt);}
.stock-resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.sr-card{border-radius:var(--radius);padding:10px 12px;text-align:center;}
.sr-card.r{background:var(--red-bg);}
.sr-card.a{background:#FEF3C7;}
.sr-card.v{background:var(--green-bg);}
.sr-num{font-size:24px;font-weight:700;}
.sr-num.r{color:var(--red);}
.sr-num.a{color:#92400E;}
.sr-num.v{color:var(--green);}
.sr-label{font-size:11px;font-weight:600;margin-top:2px;}
.sr-label.r{color:var(--red);}
.sr-label.a{color:#92400E;}
.sr-label.v{color:var(--green);}
.config-section{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px;}
.config-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt2);margin-bottom:10px;}
/* === CATÁLOGO VENTAS === */
.vcat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:480px){.vcat-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:700px){.vcat-grid{grid-template-columns:repeat(4,1fr);}}
.vcat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.vcat-card:hover,.vcat-card:active{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12);}
.vcat-card.agotado{opacity:.4;cursor:not-allowed;}
.vcat-foto{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:50px;position:relative;overflow:hidden;}
@media(min-width:600px){.vcat-foto{height:130px;}}
.vcat-foto img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.vcat-badge{position:absolute;top:6px;right:6px;background:var(--txt);color:var(--bg);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:2;}
.vcat-sin-stock{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.05em;}
.vcat-info{padding:8px 10px 10px;}
.vcat-nombre{font-size:12px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:3px;}
